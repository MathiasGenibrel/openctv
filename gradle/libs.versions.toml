# Toutes les versions ont >= 10 jours (protection supply-chain). Dates : voir la PR du scaffolding.
[versions]
agp = "9.4.1"                  # 2026-09-18
kotlin = "2.4.20"              # 2026-09-07
composeBom = "2026.09.00"      # 2026-09-09
material3 = "1.5.0-beta01"     # 2026-10-07 (M3 Expressive, surcharge la version du BOM)
tvMaterial = "1.1.0"           # 2026-05-06
activityCompose = "1.13.0"     # 2026-03-11
lifecycle = "2.11.0"           # 2026-06-17
webkit = "1.17.1"              # 2026-09-23
coreKtx = "1.19.1"             # 2026-09-23
splashscreen = "1.2.0"         # 2025-11-05 (fenêtre de démarrage, API SplashScreen rétro-compatible)
koin = "4.2.2"                 # 2026-06-15
coroutines = "1.11.0"          # 2026-05-07
junit = "4.13.2"               # 2021-02-13
mockk = "1.14.11"              # 2026-05-29
turbine = "1.2.1"              # 2025-06-11
truth = "1.4.5"                # 2025-09-10
room = "2.8.5"                 # 2026-09-09
ksp = "2.3.12"                 # 2026-09-09
datastore = "1.2.1"            # 2026-03-11 (stockage local des réglages, aucun réseau)
okhttp = "5.5.0"               # 2026-08-16 (téléchargement des listes de filtres uniquement)
baselineProfile = "1.5.0"      # 2026-09-09 (plugin Gradle + macrobenchmark, outillage de build uniquement)
uiautomator = "2.4.0"          # 2026-07-01 (pilotage de la TV par le générateur de profil, jamais dans l'APK)
profileInstaller = "1.4.1"     # 2024-10-02 (installe le profil au premier lancement, 100 % local)
androidxTestJunit = "1.3.0"    # 2025-07-30 (runner du générateur uniquement)

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileInstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "baselineProfile" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
